<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- The check is cut out of the dot with a mask (no white fill), so tinting
       the icon keeps it visible instead of turning the dot into a blob. -->
  <defs>
    <mask id="check-cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="white"/>
      <path d="M16 16.5L17 18L19 16" stroke="black" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect x="5" y="2" width="14" height="20" rx="3" stroke="currentColor" stroke-width="1.5"/>
  <path d="M9 7h6M9 12h6M9 17h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="17" cy="17" r="3" fill="currentColor" mask="url(#check-cutout)"/>
</svg>
